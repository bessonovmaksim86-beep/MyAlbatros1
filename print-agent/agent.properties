# Настройки агента печати этикеток.
#
# Файл читается при запуске агента: после правки перезапустите run-agent.bat.
# Пути пишутся целиком, без кавычек. Обратная косая черта — как в проводнике.

# Порт, на котором агент слушает 127.0.0.1. Должен совпадать с
# application.label-printing.agent-url на сервере.
port=7788

# Полный путь к bartend.exe на этом компьютере.
# Пример: C:\Program Files\Seagull\BarTender 2022\BarTend.exe
bartender.path=

# Полный путь к шаблону этикетки .btw.
# Пример: C:\BarTender\yacheika.btw
template.path=

# Имя принтера этикеток в Windows. Пусто — принтер, записанный в шаблоне.
printer=

# Каталог файлов данных. Пусто — системный временный каталог.
data.dir=

# Разделитель полей файла данных: tab, comma или semicolon.
# Обязан совпадать с настройкой импорта текста внутри шаблона .btw.
delimiter=tab

# Кодировка файла данных: UTF-8 или UTF-16.
encoding=UTF-8

# Писать строку имён полей первой строкой файла.
header=true

# Этикеток на один номер.
copies=1

# Сколько секунд ждать завершения BarTender.
timeout.seconds=60

# Необязательный токен. Если задан, агент принимает печать только с
# заголовком X-Print-Token с этим значением. Тогда тот же токен нужно
# указать на сервере: application.label-printing.agent-token.
token=
