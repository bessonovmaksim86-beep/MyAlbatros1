spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/production_system?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_catalog: production_system

  flyway:
    enabled: true
    default-schema: production_system
    schemas: production_system
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

  # Загрузка журнала входного контроля (.xlsx) в разделе администрирования.
  #
  # Заводского лимита в 1 МБ не хватает: лист за год весит больше, а
  # отказ «too large» администратор получил бы до разбора файла, не
  # понимая причины. 10 МБ — журнал нескольких лет с запасом; больше
  # не нужно, потому что файл разбирается в память сервера.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

server:
  port: ${SERVER_PORT:8080}

application:
  password-encryption-key: ${PASSWORD_ENCRYPTION_KEY:local-development-key}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:ChangeMe123!}

  # Печать этикеток партии через BarTender (шаг «Номера и печать QR»).
  #
  # Выключено по умолчанию: BarTender установлен только на рабочих
  # местах склада, а вызывать внешний процесс «потому что он есть в
  # PATH» нельзя — оператор получил бы ошибку вместо этикеток. На
  # машине кладовщика включают переменными окружения без правки файла.
  label-printing:
    enabled: ${LABEL_PRINT_ENABLED:true}
    bartender-path: ${LABEL_PRINT_BARTENDER_PATH:}
    template-path: ${LABEL_PRINT_TEMPLATE_PATH:}
    printer: ${LABEL_PRINT_PRINTER:}
    data-dir: ${LABEL_PRINT_DATA_DIR:}
    delimiter: ${LABEL_PRINT_DELIMITER:tab}
    encoding: ${LABEL_PRINT_ENCODING:UTF-8}
    header: true
    copies: ${LABEL_PRINT_COPIES:1}
    timeout-seconds: ${LABEL_PRINT_TIMEOUT:60}

  # Обмен с 1С через COM-соединение (V83.COMConnector).
  #
  # Прямое подключение к СУБД PostgreSQL закрыто: сервер app1 держит
  # порт 5432 только для localhost. Обмен идёт по COM — тем же путём,
  # которым пользуется толстый клиент. Пароль не нужен: вход выполняется
  # под текущим пользователем Windows.
  #
  # Выключено по умолчанию: COM-объект V83.COMConnector существует
  # только на машине с установленной платформой 1С. Включают переменной
  # окружения ONEC_ENABLED=true на рабочем месте с 1С.
  #
  # Сервер и имя базы берутся из окна «О программе» в 1С
  # (строки «Сервер» и «Имя базы»).
  #
  #   ONEC_ENABLED=true
  #   ONEC_SERVER=app1
  #   ONEC_DATABASE=albatros
  #
  # Структуру таблиц конфигурации 1С (УПП 1.3) надо сверить в
  # конфигураторе: имена вида DocumentNN. Пока запрос пустой —
  # выполняется проверочный запрос, который подтверждает, что COM-канал
  # жив. Реальный запрос задают переменной ONEC_ZP_QUERY; требует
  # пять колонок с псевдонимами Number, Date, CustomerOrder, Customer,
  # Status.
  onec:
    enabled: ${ONEC_ENABLED:false}
    server: ${ONEC_SERVER:app1}
    database: ${ONEC_DATABASE:albatros}
    username: ${ONEC_USERNAME:}
    password: ${ONEC_PASSWORD:}
    query1c: ${ONEC_ZP_QUERY:}
    max-rows: ${ONEC_MAX_ROWS:500}
    timeout-seconds: ${ONEC_TIMEOUT:60}

    # Путь к powershell.exe, которым выполняется запрос к 1С.
    #
    # Разрядность процесса обязана совпадать с разрядностью платформы
    # 1С. Платформа 8.3.24.1548 ставится в каталог 1cv8_x86 - это
    # 32-битная сборка, и 32-битные системные утилиты Windows лежат в
    # SysWOW64 (несмотря на "64" в имени каталога).
    #
    #   ONEC_POWERSHELL_PATH=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
    #
    # Пустое значение - powershell.exe из PATH, подходит для 64-битной
    # платформы. С 32-битной сборкой такой запуск даёт "Class not
    # registered", что выглядит как отсутствие прав, хотя права в порядке.
    power-shell-path: ${ONEC_POWERSHELL_PATH:}
