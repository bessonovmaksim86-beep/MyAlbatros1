<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     БОКОВОЕ МЕНЮ БЮРО ВХОДНОГО КОНТРОЛЯ

     Механика та же, что на складе, в цеху и диспетчерской:
     панель свёрнута до 72px и раскрывается по :hover/:focus-within.
     Классы и ID собственные (bvk-*), поэтому скрипты разделов не
     перехватывают разметку друг друга.

     Счётчик у пункта «Входной контроль» — партии, взятые в работу:
     открытая карточка удерживает партию от повторного взятия, и
     видеть это нужно без захода в список.
     ========================================================= -->
<aside th:fragment="sidebar(activePage)"
       id="bvkSidebar"
       class="sidebar bvk-sidebar"
       aria-label="Навигация бюро входного контроля">

    <div class="bvk-sidebar__inner">

        <a class="department-brand"
           th:href="@{/input-control/general}"
           title="Перейти на главную страницу бюро">

            <span class="department-brand__logo">
                <img th:src="@{/images/albatros-logo.jpg}"
                     src="/images/albatros-logo.jpg"
                     alt="Предприятие Альбатрос">
            </span>

            <span class="department-brand__system">
                Производственная система
            </span>

            <strong class="department-brand__department">
                Бюро входного контроля
            </strong>
        </a>

        <div class="bvk-sidebar__note">
            Проверка оприходованных партий
        </div>

        <div class="bvk-sidebar__divider"></div>

        <nav class="bvk-navigation">

            <a class="bvk-navigation__item"
               th:classappend="${activePage == 'general'} ? ' is-active' : ''"
               th:href="@{/input-control/general}"
               title="Обзор бюро входного контроля">

                <span class="bvk-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/>
                    </svg>
                </span>

                <span class="bvk-navigation__text">
                    Обзор бюро
                </span>
            </a>

            <a class="bvk-navigation__item"
               th:classappend="${activePage == 'control'} ? ' is-active' : ''"
               th:href="@{/input-control/control}"
               title="Входной контроль оприходованных партий">

                <span class="bvk-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm-1.2 15.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/>
                    </svg>
                </span>

                <span class="bvk-navigation__text">
                    Входной контроль
                </span>

                <span class="bvk-navigation__counter"
                      th:if="${inWorkCount != null and inWorkCount > 0}"
                      th:text="${inWorkCount}">
                    2
                </span>
            </a>

            <a class="bvk-navigation__item"
               th:classappend="${activePage == 'returns'} ? ' is-active' : ''"
               th:href="@{/input-control/returns}"
               title="Партии, забракованные с возвратом поставщику">

                <span class="bvk-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8Z"/>
                    </svg>
                </span>

                <span class="bvk-navigation__text">
                    Возврат поставщику
                </span>

                <!--
                    Счётчик — партии, а не группы: возврат оформляют
                    на партию целиком, даже если возвратных групп у
                    неё несколько.
                -->
                <span class="bvk-navigation__counter"
                      th:if="${returnCount != null and returnCount > 0}"
                      th:text="${returnCount}">
                    1
                </span>
            </a>

            <a class="bvk-navigation__item"
               th:classappend="${activePage == 'quarantine'} ? ' is-active' : ''"
               th:href="@{/input-control/quarantine}"
               title="Ячейки, оставленные в изоляторе брака">

                <span class="bvk-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2 4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/>
                    </svg>
                </span>

                <span class="bvk-navigation__text">
                    Изолятор брака
                </span>

                <!--
                    Счётчик — партии, а не ячейки: в меню нужно видеть,
                    по скольким партиям в изоляторе что-то лежит, а не
                    сколько именно ячеек там лежит.
                -->
                <span class="bvk-navigation__counter"
                      th:if="${quarantineCount != null and quarantineCount > 0}"
                      th:text="${quarantineCount}">
                    1
                </span>
            </a>

        </nav>

        <div class="bvk-sidebar__footer">
            <form th:action="@{/logout}" method="post">
                <input th:if="${_csrf != null}"
                       type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="bvk-sidebar__logout">
                    <span class="bvk-sidebar__status-dot"></span>
                    <span class="bvk-sidebar__logout-text">
                        Выйти
                    </span>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- =========================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ========================================================= -->
<th:block th:fragment="topbar">

    <header class="topbar bvk-topbar">

        <div class="bvk-topbar__left">

            <span class="bvk-topbar__section">
                Модуль бюро входного контроля
            </span>
        </div>

        <div class="bvk-topbar__right">

            <time id="bvkDateTime"
                  class="bvk-clock"
                  datetime="">
                01.01.2026, 00:00:00
            </time>

            <div th:with="
                    fullName=${
                        currentUser != null
                        and !#strings.isEmpty(currentUser.fullName)
                            ? #strings.trim(currentUser.fullName)
                            : (
                                #authentication != null
                                and !#strings.isEmpty(#authentication.name)
                                    ? #authentication.name
                                    : 'Пользователь'
                            )
                    }
                 ">

                <div class="bvk-topbar__user"
                     th:with="nameParts=${#strings.arraySplit(fullName, ' ')}">

                    <span class="bvk-topbar__avatar"
                          th:text="${
                              #arrays.length(nameParts) > 1
                                  ? #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                      +
                                      #strings.substring(nameParts[1], 0, 1)
                                  )
                                  : #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                  )
                          }">
                        ИИ
                    </span>

                    <span class="bvk-topbar__user-data">

                        <strong class="bvk-topbar__username"
                                th:text="${
                                    #arrays.length(nameParts) > 1
                                        ? nameParts[0]
                                          + ' '
                                          + #strings.substring(nameParts[1], 0, 1)
                                          + '.'
                                        : fullName
                                }">
                            Иванов И.
                        </strong>

                        <small class="bvk-topbar__specialty"
                               th:text="${
                                   currentUser != null
                                   and !#strings.isEmpty(currentUser.specialty)
                                       ? currentUser.specialty
                                       : 'Должность не указана'
                               }">
                            Контролёр
                        </small>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Режим входа в интерфейс другой роли: возврат доступен с любой страницы -->
    <div th:replace="~{fragments/impersonation :: bar}"></div>
</th:block>


<!-- =========================================================
     ОБЩИЕ СКРИПТЫ
     ========================================================= -->
<th:block th:fragment="commonScripts">
    <script th:src="@{/input-control/js/common.js}"></script>
</th:block>

</body>
</html>
