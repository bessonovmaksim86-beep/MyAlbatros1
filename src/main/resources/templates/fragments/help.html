<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     КНОПКА «СПРАВКА» В ФУТЕРЕ БОКОВОЙ ПАНЕЛИ

     Механика общая, разметка — фрагмент на все интерфейсы:
     кнопки в семи сайдбарах отличаются только классом панели, а
     список разделов для окна строит js/app-help.js из того же
     меню, поэтому держать в каждом разделе копию ссылки на CSS и
     скрипт смысла нет — достаточно заменить футер на этот
     фрагмент и описать пункты через data-help.

     Административная панель справки не получает: там меню — это
     служебные реестры (справочники, пользователи, дни календаря),
     доступ к которым имеют несколько человек на предприятии, и
     пояснения к ним относятся к настройке системы, а не к работе
     сотрудника.
     ========================================================= -->
<div th:fragment="button" class="app-help-button__host">

    <button type="button"
            class="app-help-button"
            data-app-help
            title="Справка о пунктах меню этого интерфейса">

        <span class="app-help-button__icon"></span>

        <span class="app-help-button__text">
            Справка
        </span>
    </button>

</div>

</body>
</html>
