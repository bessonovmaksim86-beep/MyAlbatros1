<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header>
    <a th:href="@{/}">Главная</a>

    <strong>Управление пользователями</strong>

    <form class="inline-form"
          th:action="@{/logout}"
          method="post">
        <button type="submit">Выйти</button>
    </form>
</header>

<main>
    <div class="message success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <div class="message error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <section class="card">
        <h2>Добавить пользователя</h2>

        <form th:action="@{/admin/users}"
              th:object="${form}"
              method="post">

            <div class="message error"
                 th:if="${#fields.hasAnyErrors()}">
                <div th:each="item : ${#fields.allErrors()}"
                     th:text="${item.defaultMessage}">
                </div>
            </div>

            <label>
                ФИО
                <input type="text"
                       id="fullName"
                       th:field="*{fullName}"
                       placeholder="Иванов Иван Иванович"
                       autocomplete="off"
                       required>
            </label>

            <label>
                Автоматический логин
                <input type="text"
                       id="generatedLogin"
                       readonly
                       placeholder="Логин появится после ввода ФИО">
            </label>

            <label>
                Должность
                <input type="text"
                       th:field="*{specialty}"
                       placeholder="Инженер-технолог"
                       required>
            </label>

            <label>
                Роль

                <select th:field="*{role}"
                        id="roleSelect"
                        required>

                    <option value="">
                        Выберите роль
                    </option>

                    <option th:each="role : ${roles}"
                            th:value="${role.name()}"
                            th:text="${role.displayName}">
                    </option>
                </select>
            </label>

            <div id="orgFields">
                <label>
                    Служба

                    <select id="serviceSelect"
                            th:field="*{serviceId}">

                        <option value="">
                            Не выбрана
                        </option>

                        <option th:each="service : ${services}"
                                th:value="${service.id}"
                                th:text="|${service.code} — ${service.name}|">
                        </option>
                    </select>
                </label>

                <label>
                    Тип пользователя

                    <select th:field="*{roleUser}"
                            id="roleUserSelect">

                        <option value="">
                            Не выбран
                        </option>

                        <option th:each="type : ${userTypes}"
                                th:value="${type.name()}"
                                th:text="${type.displayName}">
                        </option>
                    </select>
                </label>

                <label>
                    Цех/отдел

                    <select id="unitSelect"
                            th:field="*{organizationUnitId}">

                        <option value="">
                            Без подразделения
                        </option>

                        <option th:each="unit : ${organizationUnits}"
                                th:value="${unit.id}"
                                th:attr="data-service-id=${unit.service.id}"
                                th:text="|${unit.service.code}: ${unit.name}|">
                        </option>
                    </select>

                    <small>
                        Для руководителя службы и для СГМ подразделение
                        не выбирается.
                    </small>
                </label>
            </div>

            <label>
                Пароль

                <span class="input-with-button">
                    <input type="text"
                           id="password"
                           th:field="*{password}"
                           autocomplete="new-password"
                           required>

                    <button type="button"
                            id="generatePasswordButton"
                            class="secondary-button">
                        Сгенерировать
                    </button>
                </span>
            </label>

            <button type="submit">
                Добавить пользователя
            </button>
        </form>
    </section>

    <section class="card">
        <h2>Пользователи системы</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Логин</th>
                    <th>Пароль</th>
                    <th>Должность</th>
                    <th>Служба</th>
                    <th>Цех/отдел</th>
                    <th>Тип пользователя</th>
                    <th>Роль</th>
                    <th>Активен</th>
                    <th>Действие</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>

                    <td th:text="${user.fullName != null
                        ? user.fullName
                        : 'Не указано'}">
                    </td>

                    <td>
                        <code th:text="${user.username}"></code>
                    </td>

                    <td>
                        <button type="button"
                                class="secondary-button show-password"
                                th:attr="data-url=@{/admin/users/{id}/password(id=${user.id})}">
                            Показать
                        </button>

                        <code class="visible-password" hidden>
                        </code>
                    </td>

                    <td th:text="${user.specialty != null
                        ? user.specialty
                        : 'Не указана'}">
                    </td>

                    <td th:text="${user.service != null
                        ? user.service
                        : 'Не назначена'}">
                    </td>

                    <td th:text="${user.organizationUnit != null
                        ? user.organizationUnit
                        : '—'}">
                    </td>

                    <td th:text="${user.roleUser != null
                        ? user.roleUser
                        : '—'}">
                    </td>

                    <td th:text="${user.roleName}">
                    </td>

                    <td th:text="${user.active ? 'Да' : 'Нет'}">
                    </td>

                    <td>
                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                              method="post"
                              onsubmit="return confirm('Удалить пользователя?')">
                            <button class="danger" type="submit">
                                Удалить
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="11">
                        Пользователей пока нет
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script th:inline="javascript">
    const fullNameInput =
        document.getElementById("fullName");

    const loginInput =
        document.getElementById("generatedLogin");

    const passwordInput =
        document.getElementById("password");

    const generateButton =
        document.getElementById("generatePasswordButton");

    const loginUrl =
        /*[[@{/admin/users/suggest-login}]]*/
        "/admin/users/suggest-login";

    const passwordUrl =
        /*[[@{/admin/users/generate-password}]]*/
        "/admin/users/generate-password";

    let loginTimer = null;

    async function updateLogin() {
        const fullName = fullNameInput.value.trim();

        if (!fullName.includes(" ")) {
            loginInput.value = "";
            return;
        }

        try {
            const response = await fetch(
                loginUrl
                + "?fullName="
                + encodeURIComponent(fullName)
            );

            if (!response.ok) {
                throw new Error("Ошибка HTTP");
            }

            const data = await response.json();
            loginInput.value = data.login || "";
        } catch (error) {
            loginInput.value = "Ошибка формирования";
        }
    }

    fullNameInput.addEventListener("input", function () {
        clearTimeout(loginTimer);

        loginTimer = setTimeout(
            updateLogin,
            300
        );
    });

    generateButton.addEventListener("click", async function () {
        generateButton.disabled = true;

        try {
            const response = await fetch(passwordUrl);

            if (!response.ok) {
                throw new Error("Ошибка HTTP");
            }

            const data = await response.json();

            passwordInput.value = data.password || "";
            passwordInput.focus();
            passwordInput.select();
        } catch (error) {
            alert("Не удалось сгенерировать пароль");
        } finally {
            generateButton.disabled = false;
        }
    });

    if (fullNameInput.value.trim() !== "") {
        updateLogin();
    }

</script>
<script>
    const serviceSelect =
        document.getElementById("serviceSelect");

    const unitSelect =
        document.getElementById("unitSelect");

    const roleSelect =
        document.getElementById("roleSelect");

    const roleUserSelect =
        document.getElementById("roleUserSelect");

    const orgFields =
        document.getElementById("orgFields");

    function filterUnits() {
        if (!serviceSelect || !unitSelect) {
            return;
        }

        const selectedServiceId =
            serviceSelect.value;

        Array.from(unitSelect.options)
            .forEach(function (option) {
                if (!option.value) {
                    option.hidden = false;
                    option.disabled = false;
                    return;
                }

                const optionServiceId =
                    option.dataset.serviceId;

                const isAvailable =
                    selectedServiceId !== ""
                    && optionServiceId === selectedServiceId;

                option.hidden = !isAvailable;
                option.disabled = !isAvailable;
            });

        const selectedOption =
            unitSelect.options[unitSelect.selectedIndex];

        if (
            selectedOption
            && selectedOption.value
            && selectedOption.dataset.serviceId
                !== selectedServiceId
        ) {
            unitSelect.value = "";
        }
    }

    /*
     * Администратор базы не привязывается к службе,
     * подразделению и типу пользователя.
     */
    function toggleOrganizationFields() {
        if (!roleSelect || !orgFields) {
            return;
        }

        const isAdmin = roleSelect.value === "ADMIN";

        orgFields.hidden = isAdmin;

        if (isAdmin) {
            if (serviceSelect) {
                serviceSelect.value = "";
            }

            if (unitSelect) {
                unitSelect.value = "";
            }

            if (roleUserSelect) {
                roleUserSelect.value = "";
            }
        }

        filterUnits();
    }

    if (serviceSelect) {
        serviceSelect.addEventListener(
                "change",
                filterUnits
        );
    }

    if (roleSelect) {
        roleSelect.addEventListener(
                "change",
                toggleOrganizationFields
        );
    }

    toggleOrganizationFields();
</script>
<script>
    document.addEventListener("click", async function (event) {
        const button =
            event.target.closest(".show-password");

        if (!button) {
            return;
        }

        const passwordBox =
            button.parentElement.querySelector(".visible-password");

        if (!passwordBox) {
            return;
        }

        if (!passwordBox.hidden && passwordBox.textContent.trim()) {
            passwordBox.textContent = "";
            passwordBox.hidden = true;
            button.textContent = "Показать";
            return;
        }

        button.disabled = true;

        try {
            const response = await fetch(button.dataset.url);

            if (!response.ok) {
                throw new Error("Ошибка HTTP");
            }

            const data = await response.json();

            passwordBox.textContent = data.password || "Недоступен";
            passwordBox.hidden = false;
            button.textContent = "Скрыть";
        } catch (error) {
            passwordBox.textContent = "Не удалось получить пароль";
            passwordBox.hidden = false;
            button.textContent = "Показать";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
