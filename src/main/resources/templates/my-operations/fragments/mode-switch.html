<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<!--
    Переключатель режима «Моих операций»: обычные работы, групповые ЗНП
    и их проведённые половины.

    Приём тот же, что в разделе распределения
    (workshop/fragments/distribution-mode-switch): работа у исполнителя
    одна и та же по природе — закреплённый за ним экземпляр операции, —
    но подписывается разными номерами. Обычный заказ-комплектующий входит
    в выпуск, и его изделие опознано серийным номером; групповой заказ
    (V38) задан количеством, и изделие у него появляется как номер
    ячейки, внесённый складом (V20). Общая таблица обязана была бы
    показать либо «серийный номер не выпущен» там, где серийника не
    бывает, либо пустую клетку там, где он есть.

    Перенос сделан группой, а не построчно: проведённая группа
    переходит целиком в другую половину списка, а не разбивается
    между ними. Это сохраняет цельность строки — исполнитель видит
    либо все изделия группы, либо ни одного, и цифра шапки всегда
    совпадает с тем, что под ней.

    Цифры на кнопках считаются тем же горизонтом, что и список под
    переключателем, но без проведённых строк: «0» честно означает
    «невыполненных закреплённых работ этого вида нет», а не «страница
    сломана». Проведённая сегодня работа остаётся в таблице до конца
    дня, но из цифры меню и кнопки она уже убрана.
-->
<body>

<nav class="mode-switch"
     th:fragment="modeSwitch(mode)"
     aria-label="Вид закреплённых работ">

    <a class="mode-switch__item"
       th:classappend="${mode == 'regular'} ? ' is-active' : ''"
       th:href="@{/my-operations}">

        Обычные работы

        <span class="mode-switch__counter"
              th:if="${myRegularOperationsCount != null and myRegularOperationsCount > 0}"
              th:text="${myRegularOperationsCount}">
            12
        </span>

    </a>

    <a class="mode-switch__item"
       th:classappend="${mode == 'group'} ? ' is-active' : ''"
       th:href="@{/my-operations(mode='group')}">

        Групповые ЗНП

        <span class="mode-switch__counter"
              th:if="${myGroupOperationsCount != null and myGroupOperationsCount > 0}"
              th:text="${myGroupOperationsCount}">
            3
        </span>

    </a>

    <!--
        Проведённые работы — четвёртая и пятая кнопки.

        Цифра проведённой половины считается по собранным группам, а не
        запросом: «закрыта вся группа» — свойство группы, а не строки
        плана, и запрос брал бы её группировкой по каждой из границ
        подборa (исполнитель, подразделение бюро, личная работа
        руководителя — для обоих оснований). Поэтому цифра стоит у
        проведённой кнопки того основания, чей список открыт на этой
        странице; вторая половина остаётся без подписи, а не с нулём:
        ноль на кнопке, которую не считали, читался бы как «сделанных
        работ нет».
    -->
    <a class="mode-switch__item"
       th:classappend="${mode == 'completed'} ? ' is-active' : ''"
       th:href="@{/my-operations(mode='completed')}">

        Проведённые

        <span class="mode-switch__counter"
              th:if="${myRegularCompletedCount != null and myRegularCompletedCount > 0}"
              th:text="${myRegularCompletedCount}">
            5
        </span>

    </a>

    <a class="mode-switch__item"
       th:classappend="${mode == 'group-completed'} ? ' is-active' : ''"
       th:href="@{/my-operations(mode='group-completed')}">

        Проведённые групповые ЗНП

        <span class="mode-switch__counter"
              th:if="${myGroupCompletedCount != null and myGroupCompletedCount > 0}"
              th:text="${myGroupCompletedCount}">
            2
        </span>

    </a>

</nav>

</body>
</html>
