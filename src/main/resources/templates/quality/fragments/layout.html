<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     БОКОВОЕ МЕНЮ СЛУЖБЫ КАЧЕСТВА

     Механика та же, что на складе, в цеху и бюро входного
     контроля: панель свёрнута до 72px и раскрывается по
     :hover/:focus-within. Классы и ID собственные (sk-*),
     поэтому скрипты разделов не перехватывают разметку друг
     друга.

     Счётчик у «Разбора изолятора» — партии, по которым в
     изоляторе что-то лежит; счётчик заказов — незакрытые ЗНП.
     Обе цифры берут в QualityViewAdvice и видят с любой
     страницы модуля: ячейка, закреплённая за заказом, из
     разбора не исчезает, и это нужно видеть без захода в реестр.
     ========================================================= -->
<aside th:fragment="sidebar(activePage)"
       id="skSidebar"
       class="sidebar sk-sidebar"
       aria-label="Навигация службы качества">

    <div class="sk-sidebar__inner">

        <a class="department-brand"
           th:href="@{/quality/general}"
           title="Перейти на главную страницу службы">

            <span class="department-brand__logo">
                <img th:src="@{/images/albatros-logo.jpg}"
                     src="/images/albatros-logo.jpg"
                     alt="Предприятие Альбатрос">
            </span>

            <span class="department-brand__system">
                Производственная система
            </span>

            <strong class="department-brand__department">
                Служба качества
            </strong>
        </a>

        <div class="sk-sidebar__note">
            Разбор изолятора брака и заказы на ремонт
        </div>

        <div class="sk-sidebar__divider"></div>

        <!--
            Пункт в меню один — «Изолятор брака»: модуль службы
            качества пока ограничили разбором брака, и вторых разделов
            руководитель не ведёт. Обзор службы открывают по логотипу
            слева вверху, заказы на ремонт — кнопкой на странице
            изолятора и со сводки: отдельного пункта для них пока нет.
        -->
        <nav class="sk-navigation">

            <a class="sk-navigation__item"
               th:classappend="${activePage == 'quarantine' or activePage == 'orders'}
                   ? ' is-active'
                   : ''"
               th:href="@{/quality/quarantine}"
               title="Изолятор брака: отбор ячеек и отметка состава">

                <span class="sk-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2 4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/>
                    </svg>
                </span>

                <span class="sk-navigation__text">
                    Изолятор брака
                </span>

                <!--
                    Счётчик — партии, а не ячейки: в меню нужно видеть,
                    по скольким партиям в изоляторе что-то лежит.
                -->
                <span class="sk-navigation__counter"
                      th:if="${quarantineCount != null and quarantineCount > 0}"
                      th:text="${quarantineCount}">
                    1
                </span>
            </a>

            <a class="sk-navigation__item"
               th:if="${canViewUnit}"
               th:classappend="${activePage == 'staff'} ? ' is-active' : ''"
               th:href="@{/workshop/staff}"
               title="Сотрудники подразделения и их привязки">

                <span class="sk-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                </span>

                <span class="sk-navigation__text">
                    Сотрудники
                </span>

                <span class="sk-navigation__counter"
                      th:if="${staffCount != null and staffCount > 0}"
                      th:text="${staffCount}">
                    1
                </span>
            </a>

        </nav>

        <div class="sk-sidebar__footer">
            <form th:action="@{/logout}" method="post">
                <input th:if="${_csrf != null}"
                       type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="sk-sidebar__logout">
                    <span class="sk-sidebar__status-dot"></span>
                    <span class="sk-sidebar__logout-text">
                        Выйти
                    </span>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- =========================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ========================================================= -->
<th:block th:fragment="topbar">

    <header class="topbar sk-topbar">

        <div class="sk-topbar__left gs-host">

            <span class="gs-host__section">
                Модуль службы качества
            </span>

            <div th:replace="~{fragments/global-search
                    :: field('Поиск по изделиям, операциям и местам; заказ (ЗП-2026-005), серийный номер, ЗНП, приходный ордер')}">
            </div>
        </div>

        <div class="sk-topbar__right">

            <time id="skDateTime"
                  class="sk-clock"
                  datetime="">
                01.01.2026, 00:00:00
            </time>

            <div th:with="
                    fullName=${
                        currentUser != null
                        and !#strings.isEmpty(currentUser.fullName)
                            ? #strings.trim(currentUser.fullName)
                            : (
                                #authentication != null
                                and !#strings.isEmpty(#authentication.name)
                                    ? #authentication.name
                                    : 'Пользователь'
                            )
                    }
                 ">

                <div class="sk-topbar__user"
                     th:with="nameParts=${#strings.arraySplit(fullName, ' ')}">

                    <span class="sk-topbar__avatar"
                          th:text="${
                              #arrays.length(nameParts) > 1
                                  ? #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                      +
                                      #strings.substring(nameParts[1], 0, 1)
                                  )
                                  : #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                  )
                          }">
                        ИИ
                    </span>

                    <span class="sk-topbar__user-data">

                        <strong class="sk-topbar__username"
                                th:text="${
                                    #arrays.length(nameParts) > 1
                                        ? nameParts[0]
                                          + ' '
                                          + #strings.substring(nameParts[1], 0, 1)
                                          + '.'
                                        : fullName
                                }">
                            Иванов И.
                        </strong>

                        <small class="sk-topbar__specialty"
                               th:text="${
                                   currentUser != null
                                   and !#strings.isEmpty(currentUser.specialty)
                                       ? currentUser.specialty
                                       : 'Должность не указана'
                               }">
                            Руководитель службы качества
                        </small>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Режим входа в интерфейс другой роли: возврат доступен с любой страницы -->
    <div th:replace="~{fragments/impersonation :: bar}"></div>
</th:block>


<!-- =========================================================
     ОБЩИЕ СКРИПТЫ
     ========================================================= -->
<th:block th:fragment="commonScripts">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <script th:src="@{/quality/js/common.js}"></script>
    <!-- Прокрутка страницы в виде датчика ДУУ2М: один большой поплавок -->
    <script th:src="@{/js/float-scroll.js}"></script>
    <!-- Фоновая проверка счётчиков: звук + тосты при приросте -->
    <script th:src="@{/js/notifications.js}"></script>
</th:block>

</body>
</html>
