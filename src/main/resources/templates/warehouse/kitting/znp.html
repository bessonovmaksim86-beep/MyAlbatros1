<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Комплектование ЗНП</title>

    <link rel="stylesheet"
          th:href="@{/technology/css/technology.css}">

    <link rel="stylesheet"
          th:href="@{/technology/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/warehouse/css/warehouse.css}">
</head>

<body>

<div class="app-shell">

    <aside th:replace="~{warehouse/fragments/layout
            :: sidebar('kitting-znp')}">
    </aside>

    <main class="main">

        <header th:replace="~{warehouse/fragments/layout
                :: topbar}">
        </header>

        <div class="page-content warehouse-page">

            <!--
                Раздел склада комплектования: список разрезан
                «изделие → операции». Раздел полуфабрикатов остаётся
                плоским — у него нет заказов-комплектующих, поэтому
                разметка у него своя, а не общая на два склада.
            -->
            <th:block th:replace="~{warehouse/kitting/fragments/znp-list
                    :: list('znp')}">
            </th:block>

        </div>

        <th:block th:replace="~{warehouse/fragments/layout
                :: commonScripts}">
        </th:block>

        <script>
            /*
             * Раскрытие панели изделия — тот же приём, что в
             * «Мои операции»: ключ — индекс строки списка, а не id
             * изделия, потому что индекс остаётся единственным
             * устойчивым идентификатором разметки.
             */
            function toggleZnp(index) {
                const panel = document.getElementById('znp-panel-' + index);
                const caret = document.getElementById('znp-caret-' + index);

                if (!panel) {
                    return;
                }

                const hidden = panel.style.display === 'none';

                panel.style.display = hidden ? '' : 'none';
                if (caret) {
                    caret.textContent = hidden ? '▲' : '▼';
                }
            }

            /*
             * Панели свёрнуты по умолчанию: кладовщик выбирает изделие
             * по серийному номеру и наименованию, а проведение живёт в
             * раскрытии. Кнопка в скрытой панели не теряется — строка
             * сразу показывает число операций и то, можно ли провести
             * хоть одну.
             */
            (function collapseZnpPanels() {
                document
                    .querySelectorAll('.kitting-znp-panel')
                    .forEach(panel => {
                        panel.style.display = 'none';
                    });
            })();
        </script>

    </main>
</div>

</body>
</html>
