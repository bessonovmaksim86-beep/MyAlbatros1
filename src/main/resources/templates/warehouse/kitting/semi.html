<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Комплектование полуфабрикатов</title>

    <link rel="stylesheet"
          th:href="@{/technology/css/technology.css}">

    <link rel="stylesheet"
          th:href="@{/technology/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/warehouse/css/warehouse.css}">
</head>

<body>

<div class="app-shell">

    <aside th:replace="~{warehouse/fragments/layout
            :: sidebar('kitting-semi')}">
    </aside>

    <main class="main">

        <header th:replace="~{warehouse/fragments/layout
                :: topbar}">
        </header>

        <div class="page-content warehouse-page">

            <!--
                Раздел склада полуфабрикатов: тот же список, другое
                подразделение. Границу задаёт адрес, поэтому страница
                не выбирает склад параметром и не может показать
                работу склада комплектования.
            -->
            <th:block th:replace="~{warehouse/kitting/fragments/section
                    :: list('semi')}">
            </th:block>

        </div>

        <th:block th:replace="~{warehouse/fragments/layout
                :: commonScripts}">
        </th:block>

    </main>
</div>

</body>
</html>
