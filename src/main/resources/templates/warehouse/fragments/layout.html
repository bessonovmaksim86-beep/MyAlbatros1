<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     БОКОВОЕ МЕНЮ СКЛАДА ПОЛУФАБРИКАТОВ

     Механика та же, что в цеху и диспетчерской: панель свёрнута
     до 72px и раскрывается по :hover/:focus-within, поэтому
     счётчик незакрытых приходов виден и в свёрнутом состоянии не
     теряется — он вынесен в отдельный маркер у иконки.
     ========================================================= -->
<aside th:fragment="sidebar(activePage)"
       id="warehouseSidebar"
       class="sidebar warehouse-sidebar"
       aria-label="Навигация склада полуфабрикатов">

    <div class="warehouse-sidebar__inner">

        <a class="department-brand"
           th:href="@{/warehouse/general}"
           title="Перейти на главную страницу склада">

            <span class="department-brand__logo">
                <img th:src="@{/images/albatros-logo.jpg}"
                     src="/images/albatros-logo.jpg"
                     alt="Предприятие Альбатрос">
            </span>

            <span class="department-brand__system">
                Производственная система
            </span>

            <strong class="department-brand__department">
                Склад полуфабрикатов
            </strong>
        </a>

        <div class="warehouse-sidebar__note">
            Приход ячеек и их нумерация
        </div>

        <div class="warehouse-sidebar__divider"></div>

        <nav class="warehouse-navigation">

            <a class="warehouse-navigation__item"
               th:classappend="${activePage == 'general'} ? ' is-active' : ''"
               th:href="@{/warehouse/general}"
               title="Обзор склада">

                <span class="warehouse-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/>
                    </svg>
                </span>

                <span class="warehouse-navigation__text">
                    Обзор склада
                </span>
            </a>

            <a class="warehouse-navigation__item"
               th:classappend="${activePage == 'receiving'} ? ' is-active' : ''"
               th:href="@{/warehouse/receiving}"
               title="Оприходование ячеек">

                <span class="warehouse-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Zm0 2.2 6.6 3.3L12 10.8 5.4 7.5 12 4.2ZM5 9.3l6 3v7.6l-6-3V9.3Zm8 10.6v-7.6l6-3v7.6l-6 3Z"/>
                    </svg>
                </span>

                <span class="warehouse-navigation__text">
                    Оприходование
                </span>

                <span class="warehouse-navigation__counter"
                      th:if="${pendingReceivingCount != null and pendingReceivingCount > 0}"
                      th:text="${pendingReceivingCount}">
                    2
                </span>
            </a>

            <a class="warehouse-navigation__item"
               th:classappend="${activePage == 'acceptance'} ? ' is-active' : ''"
               th:href="@{/warehouse/acceptance}"
               title="Приёмка на склад подсборок, вернувшихся из БВК">

                <span class="warehouse-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Zm-8-2h4v2h-4V4Zm1.5 11.7-2.2 2.2-3.8-3.8 1.4-1.4 2.4 2.4 4.5-4.5 1.4 1.4-3.7 3.7Z"/>
                    </svg>
                </span>

                <span class="warehouse-navigation__text">
                    Приёмка с БВК
                </span>

                <span class="warehouse-navigation__counter"
                      th:if="${awaitingAcceptanceCount != null and awaitingAcceptanceCount > 0}"
                      th:text="${awaitingAcceptanceCount}">
                    1
                </span>
            </a>

            <a class="warehouse-navigation__item"
               th:classappend="${activePage == 'suppliers'} ? ' is-active' : ''"
               th:href="@{/warehouse/suppliers}"
               title="Поставщики и статистика приходов по ним">

                <span class="warehouse-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/>
                    </svg>
                </span>

                <span class="warehouse-navigation__text">
                    Поставщики
                </span>
            </a>

            <a class="warehouse-navigation__item"
               th:classappend="${activePage == 'my-operations'} ? ' is-active' : ''"
               th:href="@{/my-operations}"
               title="Мои операции: работы, закреплённые за мной">

                <span class="warehouse-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 2c1.93 0 3.68.7 5.05 1.85L7.85 15.05A6.97 6.97 0 0 1 4 12c0-3.87 3.13-7 7-7zm0 2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
                    </svg>
                </span>

                <span class="warehouse-navigation__text">
                    Мои операции
                </span>
            </a>

        </nav>

        <div class="warehouse-sidebar__footer">
            <form th:action="@{/logout}" method="post">
                <input th:if="${_csrf != null}"
                       type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="warehouse-sidebar__logout">
                    <span class="warehouse-sidebar__status-dot"></span>
                    <span class="warehouse-sidebar__logout-text">
                        Выйти
                    </span>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- =========================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ========================================================= -->
<th:block th:fragment="topbar">

    <header class="topbar warehouse-topbar">

        <div class="warehouse-topbar__left">

            <span class="warehouse-topbar__section">
                Модуль склада полуфабрикатов
            </span>
        </div>

        <div class="warehouse-topbar__right">

            <time id="warehouseDateTime"
                  class="warehouse-clock"
                  datetime="">
                01.01.2026, 00:00:00
            </time>

            <div th:with="
                    fullName=${
                        currentUser != null
                        and !#strings.isEmpty(currentUser.fullName)
                            ? #strings.trim(currentUser.fullName)
                            : (
                                #authentication != null
                                and !#strings.isEmpty(#authentication.name)
                                    ? #authentication.name
                                    : 'Пользователь'
                            )
                    }
                 ">

                <div class="warehouse-topbar__user"
                     th:with="nameParts=${#strings.arraySplit(fullName, ' ')}">

                    <span class="warehouse-topbar__avatar"
                          th:text="${
                              #arrays.length(nameParts) > 1
                                  ? #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                      +
                                      #strings.substring(nameParts[1], 0, 1)
                                  )
                                  : #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                  )
                          }">
                        ИИ
                    </span>

                    <span class="warehouse-topbar__user-data">

                        <strong class="warehouse-topbar__username"
                                th:text="${
                                    #arrays.length(nameParts) > 1
                                        ? nameParts[0]
                                          + ' '
                                          + #strings.substring(nameParts[1], 0, 1)
                                          + '.'
                                        : fullName
                                }">
                            Иванов И.
                        </strong>

                        <small class="warehouse-topbar__specialty"
                               th:text="${
                                   currentUser != null
                                   and !#strings.isEmpty(currentUser.specialty)
                                       ? currentUser.specialty
                                       : 'Должность не указана'
                               }">
                            Кладовщик
                        </small>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Режим входа в интерфейс другой роли: возврат доступен с любой страницы -->
    <div th:replace="~{fragments/impersonation :: bar}"></div>
</th:block>


<!-- =========================================================
     ОБЩИЕ СКРИПТЫ
     ========================================================= -->
<th:block th:fragment="commonScripts">
    <script th:src="@{/warehouse/js/common.js}"></script>
</th:block>

</body>
</html>
