<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <img src="../images/v_general.jpg" alt="Рыжий кот Кекс лежит у ноутбука." width="1024" height="683">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Фон должен быть позади контента */
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Сохраняет пропорции при масштабировании */
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<img src="../images/v_general.jpg" alt="Рыжий кот Кекс лежит у ноутбука." width="1024" height="683">
<div class="login-card">
    <!--<img src="..//v_general.jpg" alt="Рыжий кот Кекс лежит у ноутбука." width="1024" height="683">-->
    <h1>Производственная система АО "Альбатрос"</h1>
    <h2>Вход</h2>

    <div class="message error" th:if="${param.error}">
        Неверный логин или пароль
    </div>

    <div class="message success" th:if="${param.logout}">
        Вы успешно вышли из системы
    </div>

    <form th:action="@{/login}" method="post">
        <label>
            Логин
            <input type="text"
                   name="username"
                   required
                   autofocus
                   autocomplete="username">
        </label>

        <label>
            Пароль
            <input type="password"
                   name="password"
                   required
                   autocomplete="current-password">
        </label>

        <button type="submit">Войти</button>
    </form>
</div>

</body>
</html>
