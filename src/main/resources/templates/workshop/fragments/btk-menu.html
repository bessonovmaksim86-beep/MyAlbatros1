<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- ============================================================
     ПУНКТЫ МОДУЛЯ БЮРО ТЕХНИЧЕСКОГО КОНТРОЛЯ В МЕНЮ РУКОВОДИТЕЛЯ

     Мастер БТК работает в цеховом модуле (/workshop/**): у него те же
     сотрудники, календарь и операции подразделения. Но БТК не имеет
     собственного модуля входного контроля — контролёры работают через
     «Мои операции» и распределение, поэтому отдельных ссылок на
     реестры партий для БТК нет.

     Руководитель БТК видит те же пункты цехового модуля — сотрудники,
     распределение работ, календарь и «Мои операции» — и границы его
     списков определяются подразделением БТК через
     WorkshopStaffService, точно так же, как для цехов, складов и
     бюро входного контроля.
     ============================================================ -->
<th:block th:fragment="items">

    <th:block th:if="${btkModule}">

        <div class="workshop-sidebar__divider"></div>

        <!--
            Раздел «Отбраковка»: заявки цехов на браковку ячеек.

            Цех бракует ячейку по ходу сборки, а это этап технического
            контроля, поэтому заявку решает и БТК. Адрес тот же, что в
            меню БВК (input-control/fragments/layout): оба бюро обязаны
            видеть одну очередь, иначе они решали бы разные заявки,
            глядя в один реестр.

            Пункт открыт и контролёру, и руководителю: проводит заявку
            исполнитель, а руководитель читает очередь ради контроля
            подчинённого.
        -->
        <a class="workshop-navigation__item"
           th:classappend="${activePage == 'defects'} ? ' is-active' : ''"
           th:href="@{/pending-defects/list}"
           title="Заявки цехов на браковку ячеек и полуфабрикатов"
              data-help="Очередь заявок цехов на браковку ячеек и полуфабрикатов. Решение за техническим контролем.&#10;Как провести заявку:&#10;1) Открыть заявку: цех, ячейка, причина, этап выявления.&#10;2) Согласовать — «В изолятор брака»: позиция уходит в изолятор, цех увидит статус.&#10;3) Отклонить — «Отправить на согласование» с замечанием: заявка вернётся в цех.&#10;Контролёр ведёт заявку, руководитель читает очередь — адрес один и тот же.">

            <span class="workshop-navigation__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 3v1H5v2h14V4h-4V3H9Zm-3.6 4L4 19.1C4 20.1 4.9 21 6 21h12c1.1 0 2-.9 2-1.9L18.6 7H5.4Zm5.6 3h2v7h-2v-7Zm-4 0h2v7H7v-7Zm8 0h2v7h-2v-7Z"/>
                </svg>
            </span>

            <span class="workshop-navigation__text">
                Отбраковка
            </span>

            <span class="workshop-navigation__counter"
                  th:if="${pendingDefectCount != null and pendingDefectCount > 0}"
                  th:text="${pendingDefectCount}">
                2
            </span>
        </a>

        <!--
            Возвраты с контроля: работы, которые БТК сам и вернул цеху.

            Цифра считает открытые переделки, а не закрытые: контролёру
            нужно знать, сколько изделий он уже отдал на доработку и по
            каким из них цех ещё не отчитался. Закрытая переделка
            ничего не ждёт, и считать её — значит держать в меню цифру,
            которая никогда не обнуляется.

            Пункт ведёт на «Мои операции»: отметки экземпляров и кнопки
            «в изолятор брака» / «на доработку» живут там, у той же
            строки плана, а не в отдельном реестре.
        -->
        <a class="workshop-navigation__item"
           th:classappend="${activePage == 'my-operations'} ? ' is-active' : ''"
           th:href="@{/my-operations}"
           title="Работы, возвращённые бюро технического контроля на доработку"
              data-help="Возвраты с контроля.&#10;Как вернуть работу цеху:&#10;1) Открыть операцию в «Мои операции» и отметить проведённые экземпляры.&#10;2) Указать причину — она обязательна.&#10;3) «Отправить на доработку» — работа вернётся цеху в те же даты плана.&#10;4) «В изолятор брака» — изделие уходит из цеха.&#10;Цифра показывает, сколько переделок ещё не закрыто.">

            <span class="workshop-navigation__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/>
                </svg>
            </span>

            <span class="workshop-navigation__text">
                Возвраты с контроля
            </span>

            <span class="workshop-navigation__counter"
                  th:if="${openReturnCount != null and openReturnCount > 0}"
                  th:text="${openReturnCount}">
                3
            </span>
        </a>

    </th:block>

</th:block>

</body>
</html>
