<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     БОКОВОЕ МЕНЮ МОДУЛЯ РУКОВОДИТЕЛЯ ПОДРАЗДЕЛЕНИЯ
     ========================================================= -->
<aside th:fragment="sidebar(activePage)"
       id="workshopSidebar"
       class="sidebar workshop-sidebar"
       aria-label="Навигация модуля руководителя подразделения">

    <div class="workshop-sidebar__inner">

        <a class="department-brand"
           th:href="${brandUrl != null and !#strings.isEmpty(brandUrl)}
                    ? @{${brandUrl}} : @{/workshop/staff}"
           th:title="${brandUrl != null and !#strings.isEmpty(brandUrl)}
                    ? 'Перейти в свой модуль'
                    : 'Перейти к сотрудникам подразделения'">

            <span class="department-brand__logo">
                <img th:src="@{/images/albatros-logo.jpg}"
                     src="/images/albatros-logo.jpg"
                     alt="Предприятие Альбатрос">
            </span>

            <span class="department-brand__system">
                Производственная система
            </span>

            <strong class="department-brand__department"
                    th:text="${moduleTitle}">
                Руководитель цеха
            </strong>
        </a>

        <div class="workshop-sidebar__workshop"
             th:text="${workshopName}">
            Цех подготовки производства
        </div>

        <div class="workshop-sidebar__divider"></div>

        <nav class="workshop-navigation">

            <a class="workshop-navigation__item"
               th:if="${fullModule}"
               th:classappend="${activePage == 'staff'} ? ' is-active' : ''"
               th:href="@{/workshop/staff}"
               th:title="'Сотрудники ' + ${unitGenitive} + ' и их привязки'">

                <span class="workshop-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.31 0-8 1.66-8 5v3h16v-3c0-3.34-4.69-5-8-5Zm-6 6v-1c0-1.96 3.03-3.5 6-3.5s6 1.54 6 3.5v1H6Z"/>
                    </svg>
                </span>

                <span class="workshop-navigation__text">
                    Сотрудники
                </span>

                <span class="workshop-navigation__counter"
                      th:if="${staffCount != null and staffCount > 0}"
                      th:text="${staffCount}">
                    4
                </span>
            </a>

            <!--
                Пункт открыт не всем: в раздел пускает SecurityConfig, и
                исполнитель (кладовщик, контролёр), зашедший в «Мои
                операции», увидел бы здесь ссылку на 403. Условие — тот
                же признак, что и у права, поэтому меню и доступ
                расходятся не могут.
            -->
            <a class="workshop-navigation__item"
               th:if="${canDistribute}"
               th:classappend="${activePage == 'distribution'} ? ' is-active' : ''"
               th:href="@{/workshop/distribution}"
               title="Распределение работ по исполнителям подразделения">

                <span class="workshop-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 2c1.93 0 3.68.7 5.05 1.85L7.85 15.05A6.97 6.97 0 0 1 4 12c0-3.87 3.13-7 7-7zm0 2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
                    </svg>
                </span>

                <span class="workshop-navigation__text">
                    Распределение работ
                </span>

                <span class="workshop-navigation__counter"
                      th:if="${distributionTotal != null and distributionTotal > 0}"
                      th:text="${distributionTotal}">
                    3
                </span>
            </a>

            <!--
                Отдельного пункта «Групповые ЗНП» в меню нет: раздел
                открывается переключателем в шапке «Распределения работ»
                (?mode=group). Два пункта на один экран копировали бы
                друг друга и размывали признак активного раздела.
            -->
            <a class="workshop-navigation__item"
               th:if="${canViewUnit}"
               th:classappend="${activePage == 'calendar'} ? ' is-active' : ''"
               th:href="@{/workshop/calendar}"
               title="Производственный календарь отсутствий">

                <span class="workshop-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1h3V2Zm12 8H5v9h14V10ZM7 12h2v2H7v-2Zm4 0h2v2h-2v-2Zm4 0h2v2h-2v-2Zm-8 4h2v2H7v-2Zm4 0h2v2h-2v-2Z"/>
                    </svg>
                </span>

                <span class="workshop-navigation__text">
                    Производственный календарь
                </span>
            </a>

            <a class="workshop-navigation__item"
               th:classappend="${activePage == 'my-operations'} ? ' is-active' : ''"
               th:href="@{/my-operations}"
               title="Мои операции: работы, закреплённые за мной и моей группой">

                <span class="workshop-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 2c1.93 0 3.68.7 5.05 1.85L7.85 15.05A6.97 6.97 0 0 1 4 12c0-3.87 3.13-7 7-7zm0 2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/>
                    </svg>
                </span>

                <span class="workshop-navigation__text">
                    Мои операции
                </span>

                <span class="workshop-navigation__counter"
                      th:if="${myOperationsCount != null and myOperationsCount > 0}"
                      th:text="${myOperationsCount}">
                    2
                </span>
            </a>

            <!--
                Пункты модуля бюро: рисуются только руководителю бюро
                входного контроля (bvkModule), см.
                workshop/fragments/bvk-menu.
            -->
            <th:block th:replace="~{workshop/fragments/bvk-menu :: items}">
            </th:block>

            <!--
                Пункты модуля БТК: аналогично БВК, но пока не имеют
                собственных реестров — контролёры работают через
                «Мои операции» и распределение. Блок оставлен для
                расширения при появлении собственных реестров БТК.
            -->
            <th:block th:replace="~{workshop/fragments/btk-menu :: items}">
            </th:block>

        </nav>

        <div class="workshop-sidebar__footer">
            <form th:action="@{/logout}" method="post">
                <input th:if="${_csrf != null}"
                       type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="workshop-sidebar__logout">
                    <span class="workshop-sidebar__status-dot"></span>
                    <span class="workshop-sidebar__logout-text">
                        Выйти
                    </span>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- =========================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ========================================================= -->
<th:block th:fragment="topbar">

    <header class="topbar workshop-topbar">

        <div class="workshop-topbar__left gs-host">

            <span class="gs-host__section"
                  th:text="'Модуль: ' + ${moduleTitle}">
                Модуль руководителя цеха
            </span>

            <div th:replace="~{fragments/global-search
                    :: field('Поиск по изделиям, операциям и местам; заказ (ЗП-2026-005), серийный номер, ЗНП, приходный ордер')}">
            </div>
        </div>

        <div class="workshop-topbar__right">

            <time id="workshopDateTime"
                  class="workshop-clock"
                  datetime="">
                01.01.2026, 00:00:00
            </time>

            <div th:with="
                    fullName=${
                        currentUser != null
                        and !#strings.isEmpty(currentUser.fullName)
                            ? #strings.trim(currentUser.fullName)
                            : (
                                #authentication != null
                                and !#strings.isEmpty(#authentication.name)
                                    ? #authentication.name
                                    : 'Пользователь'
                            )
                    }
                 ">

                <div class="workshop-topbar__user"
                     th:with="nameParts=${#strings.arraySplit(fullName, ' ')}">

                    <span class="workshop-topbar__avatar"
                          th:text="${
                              #arrays.length(nameParts) > 1
                                  ? #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                      +
                                      #strings.substring(nameParts[1], 0, 1)
                                  )
                                  : #strings.toUpperCase(
                                      #strings.substring(nameParts[0], 0, 1)
                                  )
                          }">
                        ИИ
                    </span>

                    <span class="workshop-topbar__user-data">

                        <strong class="workshop-topbar__username"
                                th:text="${
                                    #arrays.length(nameParts) > 1
                                        ? nameParts[0]
                                          + ' '
                                          + #strings.substring(nameParts[1], 0, 1)
                                          + '.'
                                        : fullName
                                }">
                            Иванов И.
                        </strong>

                        <small class="workshop-topbar__specialty"
                               th:text="${
                                   currentUser != null
                                   and !#strings.isEmpty(currentUser.specialty)
                                       ? currentUser.specialty
                                       : 'Должность не указана'
                               }">
                            Мастер участка
                        </small>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Режим входа в интерфейс другой роли: возврат доступен с любой страницы -->
    <div th:replace="~{fragments/impersonation :: bar}"></div>
</th:block>


<!-- =========================================================
     ОБЩИЕ СКРИПТЫ
     ========================================================= -->
<th:block th:fragment="commonScripts">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <script th:src="@{/workshop/js/common.js}"></script>
    <!-- Прокрутка страницы в виде датчика ДУУ2М: один большой поплавок -->
    <script th:src="@{/js/float-scroll.js}"></script>
    <!-- Фоновая проверка счётчиков: звук + тосты при приросте -->
    <script th:src="@{/js/notifications.js}"></script>
</th:block>

</body>
</html>
