<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<!--
    Переключатель режимов распределения: обычные работы, групповые ЗНП,
    распределённые работы и распределённые групповые ЗНП.

    Обычные работы и распределённые живут на одной странице — это
    две половины одного раздела, переключение между которыми не
    должно выглядеть как уход из него. Групповые ЗНП — отдельная
    страница с другим контроллером и другим горизонтом (weeks вместо
    periodFrom/periodTo).

    Разрез у режимов разный: обычное распределение подписывает датчик
    серийным номером выпуска, а групповой заказ задан количеством, и
    изделие у него появляется только когда склад внесёт ячейки. Общая
    таблица либо потеряла бы номера заказов, либо показала бы
    «серийный номер не выпущен» там, где серийника не бывает вовсе.

    Цифры на кнопках — счётчики того же горизонта, что показан под
    переключателем.
-->
<body>

<nav class="mode-switch"
     th:fragment="modeSwitch(currentMode)"
     aria-label="Режим распределения работ">

    <!-- Обычные работы (очередь) -->
    <a class="mode-switch__item"
       th:classappend="${currentMode == 'regular'} ? ' is-active' : ''"
       th:href="@{/workshop/distribution(periodFrom=${periodFrom}, periodTo=${periodTo})}">

        Обычные работы

        <span class="mode-switch__counter"
              th:if="${assignableTotal != null and assignableTotal > 0}"
              th:text="${assignableTotal}">
            12
        </span>

    </a>

    <!-- Групповые ЗНП -->
    <a class="mode-switch__item"
       th:classappend="${currentMode == 'group'} ? ' is-active' : ''"
       th:href="@{/workshop/distribution/group-znp(weeks=${weeks})}">

        Групповые ЗНП

        <span class="mode-switch__counter"
              th:if="${groupZnpTotal != null and groupZnpTotal > 0}"
              th:text="${groupZnpTotal}">
            3
        </span>

    </a>

    <!-- Распределённые работы -->
    <a class="mode-switch__item"
       th:classappend="${currentMode == 'assigned'} ? ' is-active' : ''"
       th:href="@{/workshop/distribution(mode='assigned', periodFrom=${periodFrom}, periodTo=${periodTo})}">

        Распределённые работы

        <span class="mode-switch__counter"
              th:if="${assignedRegularCount != null and assignedRegularCount > 0}"
              th:text="${assignedRegularCount}">
            5
        </span>

    </a>

    <!-- Распределённые групповые ЗНП -->
    <a class="mode-switch__item"
       th:classappend="${currentMode == 'assigned-group'} ? ' is-active' : ''"
       th:href="@{/workshop/distribution(mode='assigned-group', periodFrom=${periodFrom}, periodTo=${periodTo})}">

        Распределённые групповые ЗНП

        <span class="mode-switch__counter"
              th:if="${assignedGroupCount != null and assignedGroupCount > 0}"
              th:text="${assignedGroupCount}">
            2
        </span>

    </a>

</nav>

</body>
</html>
