<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<!--
    Переключатель режима распределения: обычные работы и групповые ЗНП.

    Оба экрана — один раздел руководителя: он отвечает за работы своего
    подразделения, просто у группового ЗНП другой разрез (заказ →
    ячейки → операции) и другое основание строки плана (V56). Держать их
    в одном меню, но на двух несвязанных страницах, значило заставлять
    мастера каждый раз вспоминать, где какая работа лежит; переключатель
    ставит обе половины перед ним одним движением.

    Режимы не смешиваются в одной таблице намеренно: обычное
    распределение группирует строки по изделию выпуска и печатает
    серийный номер, а групповой заказ задан количеством, и изделие у
    него появляется только когда склад внесёт ячейки. Общая таблица
    либо потеряла бы номера заказов, либо показала бы «серийный номер не
    выпущен» там, где серийника не бывает вовсе.

    Цифры на кнопках — счётчики того же горизонта, что показан под
    переключателем (см. ModuleMenuCountersViewAdvice), поэтому кнопка
    «0» честно означает «распределять нечего», а не «страница сломана».

    Срок работ в ссылку не переносится: горизонт у режимов общий и
    живёт в панели под переключателем, а адрес каждого режима остаётся
    закладкой, которую можно передать коллеге.
-->
<body>

<nav class="mode-switch"
     th:fragment="modeSwitch(mode)"
     aria-label="Режим распределения работ">

    <a class="mode-switch__item"
       th:classappend="${mode == 'regular'} ? ' is-active' : ''"
       th:href="@{/workshop/distribution}">

        Обычные работы

        <span class="mode-switch__counter"
              th:if="${assignableTotal != null and assignableTotal > 0}"
              th:text="${assignableTotal}">
            12
        </span>

    </a>

    <a class="mode-switch__item"
       th:classappend="${mode == 'group'} ? ' is-active' : ''"
       th:href="@{/workshop/distribution/group-znp}">

        Групповые ЗНП

        <span class="mode-switch__counter"
              th:if="${groupZnpTotal != null and groupZnpTotal > 0}"
              th:text="${groupZnpTotal}">
            3
        </span>

    </a>

</nav>

</body>
</html>
