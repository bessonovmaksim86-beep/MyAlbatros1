<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{technology/fragments/layout :: head('Операции')}"></head><body><div class="app"><aside th:replace="~{technology/fragments/layout :: sidebar(${activePage})}"></aside><main class="main"><header th:replace="~{technology/fragments/layout :: topbar}"></header><div class="content"><section class="page"><div class="page-head"><div><h1>Операции</h1><p>Добавление операций и привязка к цехам или отделам</p></div><span class="badge badge-warn"><i class="dot"></i>Справочник операций</span></div><div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
<div class="card gap"><div class="card-head"><h2>Добавление операции</h2><small>Поля со знаком * обязательны</small></div><div class="card-body"><form method="post" th:action="@{/technology/operation}" th:object="${operationForm}" id="operationForm"><input th:if="${_csrf!=null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><div class="field span-2"><label for="operationName">Название *</label><input id="operationName" th:field="*{name}" maxlength="255" required><span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></div><div class="field"><label for="operationType">Тип *</label><select id="operationType" th:field="*{type}" required><option value="">Выберите тип</option><option th:each="x:${operationTypes}" th:value="${x}" th:text="${x.displayName}"></option></select><span class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span></div><div class="field"><label for="targetType">Тип подразделения *</label><select id="targetType" th:field="*{targetType}" required><option value="">Выберите</option><option value="WORKSHOP">Цех</option><option value="DEPARTMENT">Отдел</option></select><span class="field-error" th:if="${#fields.hasErrors('targetType')}" th:errors="*{targetType}"></span></div><div class="field span-2"><label for="targetId">Цех или отдел *</label><select id="targetId" th:field="*{targetId}" required><option value="">Сначала выберите тип</option><option th:each="x:${workshops}" th:value="${x.id}" data-target-type="WORKSHOP" th:text="${x.code+' · '+x.name}"></option><option th:each="x:${departments}" th:value="${x.id}" data-target-type="DEPARTMENT" th:text="${x.code+' · '+x.name}"></option></select><span class="field-error" th:if="${#fields.hasErrors('targetId')}" th:errors="*{targetId}"></span></div></div><div class="alert danger" th:if="${#fields.hasGlobalErrors()}"><span th:each="e:${#fields.globalErrors()}" th:text="${e.defaultMessage}"></span></div><div class="form-actions"><button type="reset" class="btn secondary">Очистить</button><button class="btn primary">Сохранить операцию</button></div></form></div></div>
<div class="card"><div class="card-head"><div><h2>Список операций</h2><p>Всего: <b th:text="${operationCount}">0</b></p></div></div><div class="toolbar"><input id="operationSearch" placeholder="Поиск по названию"><select id="operationFilter"><option value="ALL">Все типы</option><option th:each="x:${operationTypes}" th:value="${x}" th:text="${x.displayName}"></option></select></div><div class="table-wrap"><table><thead><tr><th>Название</th><th>Тип</th><th>Цех</th><th>Отдел</th><th>Статус</th></tr></thead><tbody><tr class="operation-row" th:each="x:${operations}" th:attr="data-name=${x.name},data-type=${x.type}"><td><b th:text="${x.name}"></b></td><td th:text="${x.type.displayName}"></td><td th:text="${x.workshop!=null?x.workshop.code+' · '+x.workshop.name:'—'}"></td><td th:text="${x.department!=null?x.department.code+' · '+x.department.name:'—'}"></td><td><span class="status done" th:if="${x.active}">Активна</span><span class="status draft" th:unless="${x.active}">Неактивна</span></td></tr><tr th:if="${#lists.isEmpty(operations)}"><td colspan="5" class="empty">Операции пока не добавлены</td></tr></tbody></table></div></div></section></div></main></div><th:block th:replace="~{technology/fragments/layout :: scripts}"></th:block><script th:src="@{/technology/js/operation.js}"></script></body></html>
