<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- =========================================================
     БОКОВОЕ МЕНЮ
     ========================================================= -->
<aside th:fragment="sidebar(activePage)"
       id="technologySidebar"
       class="sidebar technology-sidebar"
       aria-label="Навигация технологического отдела">

    <div class="technology-sidebar__inner">

        <a class="department-brand"
           th:href="@{/technology/general}"
           title="Перейти на главную страницу отдела">

            <span class="department-brand__logo">
                <img th:src="@{/images/albatros-logo.jpg}"
                     src="/images/albatros-logo.jpg"
                     alt="Предприятие Альбатрос">
            </span>

            <span class="department-brand__system">
                Производственная система
            </span>

            <strong class="department-brand__department">
                Технологический отдел
            </strong>
        </a>

        <div class="technology-sidebar__divider"></div>

        <a class="technology-navigation__item"
           th:classappend="${activePage == 'general'} ? ' is-active' : ''"
           th:href="@{/technology/general}"
           title="Обзор отдела"
              data-help="Сводка бюро: техпроцессы без утверждения, операции и места без привязки, загруженность подразделений. Экран ничего не меняет.&#10;Как пользоваться:&#10;1) Ищите строки «без утверждения» и «не настроено» — это то, что тормозит план.&#10;2) Клик по строке ведёт в карточку техпроцесса или в справочник.">

                <span class="technology-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/>
                    </svg>
                </span>

            <span class="technology-navigation__text">
                    Обзор отдела
                </span>
        </a>

            <a class="technology-navigation__item"
               th:classappend="${activePage == 'techprocess'} ? ' is-active' : ''"
               th:href="@{/technology/techprocess}"
               title="Техпроцессы"
                  data-help="Техпроцессы изделий: последовательность операций с подразделениями, местами и контролируемыми параметрами. По утверждённому ТП планировщик ставит работы.&#10;Как провести техпроцесс:&#10;1) «Создать»: вид изделия, класс датчика, изделие из классификатора → «Перейти к заполнению».&#10;2) Шапка: код техпроцесса, примечание.&#10;3) Операции по порядку: «Добавить операцию», для каждой — трудозатраты (ч), машиновремя (ч), макс. в день, «Выполняется после», «Рабочие места» (обязательно), «Контролируемые параметры», описание операции. «Сохранить».&#10;4) Готовый ТП можно «Применить техпроцесс» к другому изделию (копия) или «Сделать базовым техпроцессом изделия» в классификаторе.&#10;5) «Удалить техпроцесс» — по кнопке «Выбрать»; заказ, где ТП уже применён, не удалится.">

                <span class="technology-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 2h6a2 2 0 0 1 2 2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2-2Zm0 4h6V4H9v2Zm-2 5v2h10v-2H7Zm0 5v2h7v-2H7Z"/>
                    </svg>
                </span>

                <span class="technology-navigation__text">
                    Техпроцессы
                </span>
            </a>

            <a class="technology-navigation__item"
               th:classappend="${activePage == 'operation'} ? ' is-active' : ''"
               th:href="@{/technology/operation}"
               title="Операции"
                  data-help="Справочник технологий: наименование, вид, исполнитель, служба и подразделение. Из этих строк собирают техпроцессы; трудозатраты и машиновремя задают не здесь, а в самом техпроцессе.&#10;Как заполнить:&#10;1) «Добавить операцию»: наименование, тип операции (производственная, передаточная, возвратная, распределение работ, получение комплектации, комплектовочная, комплектование подсборок, контрольная, приёмка на склад), тип исполнителя, служба, подразделение, примечание.&#10;2) Порядок такой: сначала тип исполнителя — после него станет доступна служба, затем подразделение.&#10;3) «Изменить операцию» и «Удалить операцию»: на открывшейся странице «Выбор операции» укажите операцию из списка, дальше форма правки либо подтверждение удаления.&#10;Операцию, которая уже стоит в техпроцессе, система не отдаст на удаление — сначала снимите её там.">

                <span class="technology-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 3h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 10h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Zm2-8v4h4V5H6Zm0 10v4h4v-4H6Z"/>
                    </svg>
                </span>

                <span class="technology-navigation__text">
                    Операции
                </span>
            </a>

        <a class="technology-navigation__item"
           th:classappend="${activePage == 'classifier'} ? ' is-active' : ''"
           th:href="@{/technology/classifier}"
           title="Классификатор"
              data-help="Классификатор изделий: четырёхзначный код, тип и исполнение. Связывает изделие с каталогом датчиков и с составом ЗНП.&#10;Как заполнять:&#10;1) «Добавить»: код (1000–9999), тип изделия; для датчика — класс из каталога и исполнение, для остального — наименование.&#10;2) Код и исполнение проверяются на занятость: второй раз ту же пару «класс + исполнение» система не примет.&#10;3) «Сделать базовым» — закрепить за изделием техпроцесс по умолчанию.&#10;4) «Добавить техпроцесс» в маршрутах — какие ТП допустимы для этого изделия.&#10;5) «Обновить» в редакторе, «Удалить» — пока изделие не вошло в состав заказа.">

    <span class="technology-navigation__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 3h6v6H4V3Zm10 0h6v6h-6V3ZM4 13h6v6H4v-6Zm10 0h6v6h-6v-6Z"/>
        </svg>
    </span>

            <span class="technology-navigation__text">
        Классификатор
    </span>
        </a>

            <a class="technology-navigation__item"
               th:classappend="${activePage == 'workplace'} ? ' is-active' : ''"
               th:href="@{/technology/workplace}"
               title="Рабочие места"
                  data-help="Рабочие места подразделений: где именно выполняют операцию. Планировщик назначает работу месту, а не человеку напрямую.&#10;Как заполнить:&#10;1) «Добавить рабочее место»: код, наименование рабочего места, тип рабочего места, тип исполнителя, служба, подразделение, примечание.&#10;2) Порядок такой: сначала тип исполнителя — после него станет доступна служба, затем подразделение.&#10;3) «Изменить рабочее место» и «Удалить рабочее место»: на открывшейся странице «Выбор рабочего места» укажите место из списка, дальше форма правки либо подтверждение удаления.&#10;Без места в этом справочнике операциям техпроцесса нечего брать в работу; занятое в техпроцессе место система не отдаст на удаление.">

                <span class="technology-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 4h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 2v8h16V6H4Z"/>
                    </svg>
                </span>

                <span class="technology-navigation__text">
                    Рабочие места
                </span>
            </a>

            <a class="technology-navigation__item"
               th:classappend="${activePage == 'controlparam'} ? ' is-active' : ''"
               th:href="@{/technology/controlparam}"
               title="Контролируемые параметры"
                  data-help="Справочник параметров контроля: наименование и тип. Операция требует занести значения тех параметров, что к ней привязаны.&#10;Как заполнить:&#10;1) «Добавить параметр»: наименование и тип параметра — «Список» или «Поле ввода».&#10;2) Для «Списка» заполните «Варианты выбора»: пустая строка внизу — для нового варианта, кресток удаляет строку. Без вариантов такой параметр не сохранится.&#10;3) Для «Поля ввода» варианты не нужны — значение впишут при выполнении операции.&#10;4) Если в наименовании есть слово «ячейка», параметр считают ячеечным: значение берут не из списка, а из состава входящих ячеек изделия.&#10;5) «Изменить параметр» и «Удалить параметр» — через страницу «Выбор операции» с перечнем параметров. Привязанный к операции параметр не удалится, сначала снимите его в конструкторе техпроцесса.">

                <span class="technology-navigation__icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 5h18v2H3V5Zm0 6h12v2H3v-2Zm0 6h18v2H3v-2Zm14-6h4v2h-4v-2Z"/>
                    </svg>
                </span>

                <span class="technology-navigation__text">
                    Контролируемые параметры
                </span>
            </a>

            <!--
                Разделов планирования («Распределение работ», «Мои
                операции») в меню отдела намеренно нет: техбюро строит
                техпроцессы и согласует их, а распределяет работы
                руководитель того подразделения, за которым планировщик
                закрепил операции.
            -->
        </nav>

        <div class="technology-sidebar__footer">
            <div th:replace="~{fragments/help :: button}"></div>
            <form th:action="@{/logout}" method="post">
                <input th:if="${_csrf != null}"
                       type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="technology-sidebar__logout">
                    <span class="technology-sidebar__status-dot"></span>
                    <span class="technology-sidebar__logout-text">
                        Выйти
                    </span>
                </button>
            </form>
        </div>
    </div>
</aside>

<!-- =========================================================
     ВЕРХНЯЯ ПАНЕЛЬ
     ========================================================= -->
<th:block th:fragment="topbar">

    <header class="topbar technology-topbar">

        <!-- Поле поиска -->
        <div class="technology-topbar__left">

            <label class="technology-search"
                   for="technologyGlobalSearch">

                <span class="visually-hidden">
                    Поиск по производственной системе
                </span>

                <input id="technologyGlobalSearch"
                       name="query"
                       type="search"
                       autocomplete="off"
                       placeholder="Поиск по изделиям, техпроцессам и местам; заказ (ЗП-2026-005), серийный номер, ЗНП, приходный ордер">
            </label>

            <!--
                Выпадающий список результатов.

                Адрес API вычисляет Thymeleaf, чтобы поиск работал
                и при выкладке приложения не на корень сервера.
                Содержимое наполняет technology/js/common.js.
            -->
            <div id="technologySearchResults"
                 class="technology-search__results"
                 role="listbox"
                 aria-label="Результаты поиска"
                 th:attr="data-search-url=@{/technology/search}"
                 hidden>
            </div>
        </div>

        <!-- Дата, время и пользователь -->
        <div class="technology-topbar__right">

            <!-- Сначала дата и время -->
            <time id="technologyDateTime"
                  class="technology-clock"
                  datetime="">
                08.09.2026, 00:00:00
            </time>

            <!--
                fullName должен иметь формат:
                Фамилия Имя Отчество

                Например:
                Иванов Иван Иванович
            -->
            <div th:with="
                    fullName=${
                        currentUser != null
                        and !#strings.isEmpty(currentUser.fullName)
                            ? #strings.trim(currentUser.fullName)
                            : (
                                #authentication != null
                                and !#strings.isEmpty(#authentication.name)
                                    ? #authentication.name
                                    : 'Пользователь'
                            )
                    }
                 ">

                <div class="technology-topbar__user"
                     th:with="
                        nameParts=${#strings.arraySplit(fullName, ' ')}
                     ">

                    <!-- Затем кружок с инициалами -->
                    <span class="technology-topbar__avatar"
                          th:text="${
                              #arrays.length(nameParts) > 1
                                  ? #strings.toUpperCase(
                                      #strings.substring(
                                          nameParts[0],
                                          0,
                                          1
                                      )
                                      +
                                      #strings.substring(
                                          nameParts[1],
                                          0,
                                          1
                                      )
                                  )
                                  : #strings.toUpperCase(
                                      #strings.substring(
                                          nameParts[0],
                                          0,
                                          1
                                      )
                                  )
                          }">
                        ИИ
                    </span>

                    <!-- Затем фамилия, первая буква имени и должность -->
                    <span class="technology-topbar__user-data">

                        <strong class="technology-topbar__username"
                                th:text="${
                                    #arrays.length(nameParts) > 1
                                        ? nameParts[0]
                                          + ' '
                                          + #strings.substring(
                                              nameParts[1],
                                              0,
                                              1
                                          )
                                          + '.'
                                        : fullName
                                }">
                            Иванов И.
                        </strong>

                        <small class="technology-topbar__specialty"
                               th:text="${
                                   currentUser != null
                                   and !#strings.isEmpty(
                                       currentUser.specialty
                                   )
                                       ? currentUser.specialty
                                       : 'Должность не указана'
                               }">
                            Инженер-технолог
                        </small>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Режим входа в интерфейс другой роли: возврат доступен с любой страницы -->
    <div th:replace="~{fragments/impersonation :: bar}"></div>
</th:block>


<!-- =========================================================
     ОБЩИЕ СКРИПТЫ
     ========================================================= -->
<th:block th:fragment="commonScripts">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <link rel="stylesheet" th:href="@{/css/app-help.css}">
    <script th:src="@{/technology/js/common.js}"></script>
    <!-- Прокрутка страницы в виде датчика ДУУ2М: один большой поплавок -->
    <script th:src="@{/js/float-scroll.js}"></script>
    <!-- Фоновая проверка счётчиков: звук + тосты при приросте -->
    <script th:src="@{/js/notifications.js}"></script>
    <!-- Справка о пунктах меню: окно строится из разметки сайдбара -->
    <script th:src="@{/js/app-help.js}"></script>
</th:block>

</body>
</html>
