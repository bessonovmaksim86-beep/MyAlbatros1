<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="fields">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{version}">
<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
  <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Ошибка сохранения</div>
</div>
<div class="classifier-form-grid">
  <div class="classifier-field-row"><div class="form-group">
    <label for="code">Код <span class="required">*</span></label>
    <input id="code" type="number" min="1000" max="9999" required th:field="*{code}" class="form-control">
    <small>Укажите четырёхзначный код от 1000 до 9999.</small>
    <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
  </div></div>

  <div class="classifier-type-row">
    <div class="form-group">
      <label for="productType">Тип изделия <span class="required">*</span></label>
      <select id="productType" th:field="*{productType}" class="form-control" required>
        <option value="">Выберите тип изделия</option>
        <option th:each="type : ${productTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option>
      </select>
      <div class="field-error" th:if="${#fields.hasErrors('productType')}" th:errors="*{productType}"></div>
    </div>
    <div id="sensorCatalogField" class="form-group" hidden>
      <label for="sensorCatalogId">Датчик из каталога <span class="required">*</span></label>
      <select id="sensorCatalogId" th:field="*{sensorCatalogId}" class="form-control" disabled>
        <option value="">Выберите датчик</option>
        <option th:each="sensor : ${sensorCatalogOptions}" th:value="${sensor.id}" th:text="${sensor.name}"></option>
      </select>
      <div class="field-error" th:if="${#fields.hasErrors('sensorCatalogId')}" th:errors="*{sensorCatalogId}"></div>
    </div>
  </div>

  <div class="classifier-field-row"><div class="form-group">
    <label for="name">Наименование</label>
    <input id="name" type="text" th:field="*{name}" class="form-control" placeholder="Введите наименование изделия">
    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
  </div></div>

  <section id="inclusionSection" class="classifier-inclusion-section" hidden>
    <div class="inclusion-section-head">
      <h2>Состав изделия</h2>
      <p>После выбора входящего изделия автоматически появится следующая строка.</p>
    </div>
    <div id="inclusionRows" class="inclusion-rows">
      <div class="inclusion-row" th:each="row, status : *{inclusions}">
        <div class="form-group inclusion-target-field">
          <label th:for="${'inclusion-target-' + status.index}">Входящее изделие</label>
          <select class="form-control inclusion-target" th:id="${'inclusion-target-' + status.index}" th:name="${'inclusions[' + status.index + '].targetId'}">
            <option value="">Выберите изделие</option>
            <option th:each="option : ${inclusionOptions}" th:value="${option.id}"
                    th:attr="data-product-type=${option.productType.name()}"
                    th:selected="${row.targetId == option.id}"
                    th:text="${option.code + ' — ' + (option.sensorCatalog != null ? option.sensorCatalog.name : option.name)}"></option>
          </select>
        </div>
        <div class="form-group inclusion-mode-field" th:hidden="${row.targetId == null}">
          <label th:for="${'inclusion-mode-' + status.index}">Режим включения</label>
          <select class="form-control inclusion-mode" th:id="${'inclusion-mode-' + status.index}"
                  th:name="${'inclusions[' + status.index + '].inclusionMode'}" th:disabled="${row.targetId == null}">
            <option value="">Выберите режим</option>
            <option th:each="mode : ${inclusionModes}" th:value="${mode.name()}"
                    th:selected="${row.inclusionMode == mode}" th:text="${mode.displayName}"></option>
          </select>
        </div>
        <input type="hidden" class="inclusion-quantity" th:name="${'inclusions[' + status.index + '].quantity'}"
               th:value="${row.quantity != null ? row.quantity : 1}" th:disabled="${row.targetId == null}">
        <input type="hidden" class="inclusion-unit" th:name="${'inclusions[' + status.index + '].unit'}"
               th:value="${row.unit != null ? row.unit.name() : 'PCS'}" th:disabled="${row.targetId == null}">
        <button type="button" class="btn btn-secondary remove-inclusion" th:hidden="${row.targetId == null}">Удалить</button>
      </div>
    </div>

    <template id="inclusionRowTemplate">
      <div class="inclusion-row">
        <div class="form-group inclusion-target-field">
          <label>Входящее изделие</label>
          <select class="form-control inclusion-target">
            <option value="">Выберите изделие</option>
            <option th:each="option : ${inclusionOptions}" th:value="${option.id}"
                    th:attr="data-product-type=${option.productType.name()}"
                    th:text="${option.code + ' — ' + (option.sensorCatalog != null ? option.sensorCatalog.name : option.name)}"></option>
          </select>
        </div>
        <div class="form-group inclusion-mode-field" hidden>
          <label>Режим включения</label>
          <select class="form-control inclusion-mode" disabled>
            <option value="">Выберите режим</option>
            <option th:each="mode : ${inclusionModes}" th:value="${mode.name()}" th:text="${mode.displayName}"></option>
          </select>
        </div>
        <input type="hidden" class="inclusion-quantity" value="1" disabled>
        <input type="hidden" class="inclusion-unit" value="PCS" disabled>
        <button type="button" class="btn btn-secondary remove-inclusion" hidden>Удалить</button>
      </div>
    </template>
  </section>

  <div class="form-group classifier-note-field">
    <label for="note">Примечание</label>
    <textarea id="note" th:field="*{note}" class="form-control" rows="4" placeholder="Дополнительная информация о классификаторе"></textarea>
    <div class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
  </div>
</div>
</th:block>
</html>
